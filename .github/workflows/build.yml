name: Build CustomNameplates

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Git
        run: |
          git status --short --branch
          git tag --list | tail -20
          git describe --tags --always --dirty
          git rev-parse HEAD

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          echo "=== build.gradle.kts : lignes 30 à 55 ==="
          nl -ba build.gradle.kts | sed -n '30,55p'
          chmod +x gradlew
          ./gradlew build --no-daemon --info

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomNameplates-JAR
          path: target/**/*.jar
          if-no-files-found: error
