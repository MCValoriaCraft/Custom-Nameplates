name: Build CustomNameplates

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: |
          git config --global user.name "MCValoriaCraft"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          path: target/*.jar
          archive: false
          if-no-files-found: error
